name: Build and publish plots

on:
  schedule:
    - cron: "15 1,7,13,19 * * *"
    - cron: "45 2,8,14,20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "requirements.*"
      - "Config.json"
      - "Basins/**/basin.geojson"
      - "map_assets/**"
      - ".github/workflows/build-plots.yml"
  pull_request:
    paths:
      - "*.py"
      - "tests/**"
      - "requirements.*"
      - "Config.json"
      - "Basins/**/basin.geojson"
      - "map_assets/**"
      - ".github/workflows/build-plots.yml"

permissions:
  contents: read

concurrency:
  group: watershed-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Test processing and failure handling
        run: python -m unittest discover -s tests -v
      - name: Restore model download cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@v5
        with:
          path: .cache/nbm
          key: nbm-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nbm-${{ runner.os }}-
      - name: Build and validate live site
        if: github.event_name != 'pull_request'
        run: python build_site.py --output .build/site --workers 4
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: failed-build
          path: .build/failed-build/
          if-no-files-found: ignore
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .build/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@v4
